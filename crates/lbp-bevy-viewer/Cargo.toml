[package]
name = "lbp-bevy-viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "bevy_log", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit", "multi_threaded", "tonemapping_luts", "png"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }
lbp-catalog.workspace = true
lbp-mesh.workspace = true
lbp-texture.workspace = true
lbp-preview.workspace = true

[dev-dependencies]
# D121: headless WGSL validation of the authored preview shader (same major as Bevy).
naga = { version = "29.0.3", features = ["wgsl-in"] }
