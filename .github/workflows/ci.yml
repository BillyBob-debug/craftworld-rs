name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole workspace, viewers included (their tests run headless; see docs/d72-ci.md).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # System libraries the Bevy and egui dependency tree links against (fontconfig first).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Pinned to the PC toolchain so new Clippy lints don't surprise branches.
      # Bump together with the PC (docs/workflow.md section 7).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      # Keyed on the toolchain and Cargo.lock; only main saves, so PR branches don't
      # evict each other's caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test -q --locked --workspace
      - name: Clippy
        run: cargo clippy -q --locked --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
